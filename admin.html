<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Control de Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-4 max-w-md mx-auto">
  
  <!-- Pantalla de PIN -->
  <div id="auth-section" class="flex flex-col items-center justify-center min-h-[80vh] space-y-6">
    <h2 class="text-2xl font-bold">Acceso Staff</h2>
    <input type="password" id="pin-input" placeholder="PIN" class="p-4 rounded-lg bg-gray-800 border border-gray-700 text-center text-2xl w-48 tracking-[0.5em] focus:outline-none focus:border-blue-500" inputmode="numeric">
    <button onclick="checkPin()" class="bg-blue-600 hover:bg-blue-700 w-48 py-3 rounded-lg font-bold transition">Ingresar</button>
  </div>

  <!-- Panel de Control -->
  <div id="admin-section" class="hidden space-y-6">
    <header class="flex justify-between items-center mb-2 mt-4">
      <h1 class="text-xl font-bold">Gestión Rápida</h1>
      <button onclick="location.reload()" class="text-sm text-gray-400 hover:text-white">Cerrar Sesión</button>
    </header>
    <main id="stock-container" class="space-y-3"></main>
  </div>

  <script>
    const supabase = supabase.createClient('TU_URL', 'TU_ANON_KEY');
    const PIN_SECRETO = '1234'; // Seguridad Client-Side para MVP

    function checkPin() {
      if (document.getElementById('pin-input').value === PIN_SECRETO) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('admin-section').classList.remove('hidden');
        loadStock();
      } else {
        alert('PIN Incorrecto');
        document.getElementById('pin-input').value = '';
      }
    }

    async function loadStock() {
      const { data, error } = await supabase.from('products').select('*').order('name');
      if (error) return console.error(error);

      document.getElementById('stock-container').innerHTML = data.map(p => `
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center">
          <span class="font-medium truncate mr-4">${p.name}</span>
          <button onclick="toggleStock('${p.id}', ${!p.is_available})"
            class="px-4 py-3 rounded-lg font-bold text-sm w-32 transition-colors active:scale-95 ${p.is_available ? 'bg-green-600/20 text-green-400 border border-green-600' : 'bg-red-600/20 text-red-400 border border-red-600'}">
            ${p.is_available ? 'DISPONIBLE' : 'AGOTADO'}
          </button>
        </div>
      `).join('');
    }

    async function toggleStock(id, newValue) {
      await supabase.from('products').update({ is_available: newValue }).eq('id', id);
    }

    supabase.channel('admin:products')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'products' }, loadStock)
      .subscribe();
  </script>
</body>
</html>
