<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | CRUD Pro</title>
  <script src="js/vendor/tailwind.js"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen p-4 flex items-center justify-center">

  <div class="max-w-4xl w-full bg-white rounded-2xl border border-stone-200/60 p-6 shadow-sm">
    
    <!-- Sección de Autenticación Supabase -->
    <div id="auth-section" class="flex flex-col items-center justify-center py-12 space-y-4">
      <h2 class="text-2xl font-black text-stone-900">Acceso Staff MVP</h2>
      <input type="email" id="email-input" placeholder="admin@craftoven.com" class="p-3 rounded-xl bg-stone-50 border border-stone-200 text-center w-64 text-stone-900 text-sm focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0 transition-all">
      <input type="password" id="password-input" placeholder="Contraseña" class="p-3 rounded-xl bg-stone-50 border border-stone-200 text-center w-64 text-stone-900 tracking-widest font-mono text-sm focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0 transition-all">
      <button onclick="checkLogin(event)" class="bg-stone-900 hover:bg-stone-800 text-white w-64 py-3 rounded-xl font-bold transition-colors">Ingresar</button>
    </div>

    <!-- Panel de Administración (Oculto por defecto) -->
    <div id="admin-section" class="hidden space-y-6">
      <header class="flex justify-between items-center border-b border-stone-200/60 pb-4">
        <div>
          <h1 class="text-xl font-bold text-stone-900">Panel de Administración</h1>
          <p class="text-xs text-stone-500">Edición completa en tiempo real</p>
        </div>
        <div class="flex gap-2">
          <button onclick="openForm()" class="bg-stone-900 hover:bg-stone-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition-colors">+ Nuevo Producto</button>
          <button onclick="logoutAdmin()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-2 rounded-xl text-xs font-semibold transition-colors">Salir</button>
        </div>
      </header>
      <main id="stock-container" class="grid gap-4 sm:grid-cols-2"></main>
    </div>
  </div>

  <!-- Modal para CRUD de Productos -->
  <div id="modal-form" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white border border-stone-200/60 rounded-2xl p-6 w-full max-w-md space-y-4 shadow-xl">
      <h3 id="modal-title" class="text-lg font-bold text-stone-900">Nuevo Producto</h3>
      <input type="hidden" id="form-id">
      <div class="space-y-3">
        <input type="text" id="form-name" placeholder="Nombre" class="w-full p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-sm text-stone-900 focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0 transition-all">
        <input type="text" id="form-category" list="categories-list" placeholder="Selecciona o escribe una categoría" autocomplete="off" class="w-full p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-sm text-stone-900 focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0 transition-all">
        <datalist id="categories-list">
          <!-- Las categorías existentes se inyectarán aquí con JavaScript -->
        </datalist>
        <input type="number" id="form-price" placeholder="Precio" class="w-full p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-sm text-stone-900 focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0 transition-all">
        <input type="text" id="form-image" placeholder="URL Foto" class="w-full p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-sm text-stone-900 focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0 transition-all">
        <textarea id="form-description" placeholder="Descripción..." rows="2" class="w-full p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-sm text-stone-900 focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0 transition-all"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeForm()" class="px-4 py-2 bg-stone-100 text-stone-700 hover:bg-stone-200 text-xs font-bold rounded-xl transition-colors">Cancelar</button>
        <button onclick="saveProduct()" class="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold rounded-xl transition-colors">Guardar</button>
      </div>
    </div>
  </div>

  <!-- 1. Librería Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
  
  <!-- 2. Configuración (Variables globales) -->
  <script src="js/config.js" defer></script>
  
  <!-- 3. Inicializador y lógica -->
  <script src="js/supabase.js" defer></script>
  <script src="js/admin/auth.js" defer></script>
  <script src="js/admin/stock.js" defer></script>
</body>
</html>
