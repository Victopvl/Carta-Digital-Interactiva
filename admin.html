<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Control de Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center p-4">
  
  <div class="w-full max-w-4xl bg-gray-800/50 backdrop-blur-md rounded-2xl border border-gray-700 p-6 md:p-8 shadow-xl">
    
    <!-- Sección de Autenticación -->
    <div id="auth-section" class="flex flex-col items-center justify-center py-12 space-y-6">
      <div class="text-center">
        <h2 class="text-3xl font-extrabold text-white tracking-tight">Acceso Staff</h2>
        <p class="text-sm text-gray-400 mt-1">Ingresa el PIN de seguridad del local</p>
      </div>
      <input type="password" id="pin-input" placeholder="••••" maxlength="4" class="p-4 rounded-xl bg-gray-900 border border-gray-700 text-center text-3xl w-48 tracking-[0.3em] font-mono focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 text-white transition-all" inputmode="numeric">
      <button onclick="checkPin()" class="bg-blue-600 hover:bg-blue-700 text-white w-48 py-3.5 rounded-xl font-bold transition-all transform active:scale-95 shadow-lg shadow-blue-600/20">Ingresar al Panel</button>
    </div>

    <!-- Panel de Control (Oculto inicialmente) -->
    <div id="admin-section" class="hidden space-y-6">
      <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-gray-700 pb-5">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-white">Gestión Rápida de Disponibilidad</h1>
          <p class="text-sm text-gray-400 mt-0.5">Control de quiebres de stock en tiempo real</p>
        </div>
        <button onclick="location.reload()" class="self-start sm:self-center px-4 py-2 bg-gray-700 hover:bg-gray-600 text-sm font-semibold rounded-xl text-gray-200 transition-all border border-gray-600">Cerrar Sesión</button>
      </header>
      
      <main id="stock-container" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 pt-2">
        <!-- Inyección dinámica de productos -->
      </main>
    </div>

  </div>

  <!-- Scripts en orden secuencial estricto -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin/auth.js"></script>
  <script src="js/admin/stock.js"></script>
</body>
</html>
