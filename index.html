<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café de Especialidad | Carta Digital</title>
  
  <script src="js/vendor/tailwind.js"></script>
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    article, button { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-amber-50/30 text-stone-800 font-sans min-h-screen">
  
  <div class="max-w-5xl mx-auto px-4 py-6">
    <header class="text-center my-6 mb-8 flex flex-col items-center">
      <div class="w-16 h-16 bg-stone-900 text-stone-100 flex items-center justify-center rounded-full text-2xl font-black shadow-md tracking-wider mb-3">CO</div>
      <h1 class="text-2xl sm:text-3xl font-black text-stone-900 tracking-wider uppercase">CRAFT OVEN</h1>
      <p class="text-[10px] sm:text-xs uppercase font-bold tracking-[0.2em] text-amber-900/80 mt-1">Cafetería & Pastelería de Especialidad</p>
    </header>

    <div class="mb-6 space-y-3 sticky top-0 bg-stone-50/95 backdrop-blur-md py-3 z-30 border-b border-stone-200/60">
  
  <!-- Buscador Premium con margen inferior para no pegarse a las categorías -->
  <div class="relative w-full mb-4">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-stone-400">
      <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
    </div>
    <input 
      type="text" 
      id="search-input" 
      oninput="filterProducts()" 
      placeholder="Buscar tu producto favorito..." 
      class="w-full pl-10 pr-4 py-3 rounded-full border border-stone-200/80 bg-stone-50 text-sm placeholder-stone-400 text-stone-900 shadow-sm transition-all duration-200 focus:outline-none focus:border-stone-400 focus:bg-white focus:ring-0"
    >
  </div>

  <!-- Filtro de Categorías -->
  <div id="categories-filter" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>
</div>

    
    <main id="menu-container" class="w-full">
      <div class="flex justify-center items-center py-20">
        <p class="text-center text-sm text-stone-500 animate-pulse font-medium">Sincronizando mesones...</p>
      </div>
    </main>
  </div>

  <!-- 1. Librería Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <!-- 2. Configuración obligatoria SIN defer para que cargue primero -->
  <script src="js/config.js"></script>
  
  <!-- 3. Inicializador y lógica -->
  <script src="js/supabase.js" defer></script>
  <script src="js/public/menu.js" defer></script>
</body>
</html>
