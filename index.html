<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café de Especialidad | Carta Digital</title>
  <!-- Tailwind CSS Oficial distribuido desde cdnjs -->
  <script src="https://cloudflare.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    article, button { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-amber-50/30 text-stone-800 font-sans min-h-screen">
  
  <div class="max-w-5xl mx-auto px-4 py-6">
    <header class="text-center my-6 flex flex-col items-center">
      <div class="w-16 h-16 bg-stone-900 text-stone-100 flex items-center justify-center rounded-full text-2xl font-black shadow-md tracking-wider mb-2">CO</div>
      <h1 class="text-2xl font-black text-stone-950 tracking-tight">CRAFT OVEN</h1>
      <p class="text-[10px] uppercase font-bold tracking-widest text-amber-800 mt-1">Cafetería & Pastelería de Especialidad</p>
    </header>

    <div class="mb-6 space-y-3 sticky top-0 bg-stone-50/95 backdrop-blur-md py-3 z-30 border-b border-stone-200/60">
      <input type="text" id="search-input" oninput="filterProducts()" placeholder="🔍 Buscar tu producto favorito..." class="w-full p-3.5 rounded-xl border border-stone-200 bg-white text-sm shadow-sm focus:outline-none focus:border-amber-600 focus:ring-1 focus:ring-amber-600 text-stone-900">
      <div id="categories-filter" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>
    </div>
    
    <main id="menu-container" class="w-full">
      <div class="flex justify-center items-center py-20">
        <p class="text-center text-sm text-stone-500 animate-pulse font-medium">Sincronizando mesones...</p>
      </div>
    </main>
  </div>

  <!-- Usamos la red de Cloudflare (cdnjs) que sí funciona en tu red sin bloqueos -->
  <script src="https://cloudflare.com"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/public/menu.js"></script>
</body>
</html>
