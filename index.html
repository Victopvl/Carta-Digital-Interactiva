<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Digital Interactiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
  
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="text-center mb-10 mt-4">
      <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Menú del Día</h1>
      <p class="text-base text-gray-500 mt-2 font-medium">✨ Actualizado en tiempo real</p>
    </header>
    
    <main id="menu-container" class="w-full">
      <div class="flex justify-center items-center py-20">
        <p class="text-center text-lg text-gray-500 animate-pulse font-medium">Cargando carta...</p>
      </div>
    </main>
  </div>

  <!-- Scripts en orden secuencial estricto -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/public/menu.js"></script>
</body>
</html>
